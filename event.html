<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الفعالية</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">فعاليات الجامعة</a>

        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="events.html" class="active">الفعاليات</a></li>
            <li><a href="about.html">عن الموقع</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>

    </nav>

    <main class="event-details" id="eventDetails">
    <h1 id="eventTitle">تفاصيل الفعالية</h1>

    <img id="eventImage"
         src="assets/img/programming2.jpg"
         alt="صورة الفعالية"
         class="event-image">

    <p><strong>التاريخ:</strong> <span id="eventDate"></span></p>
    <p><strong>المكان:</strong> <span id="eventLocation"></span></p>
    <p id="eventDescription"></p>

    <section class="photo-gallery">
    <div class="gallery-header">
        <h2>معرض صور الفعاليات</h2>

        <button type="button"
                id="toggleGallery"
                class="gallery-toggle"
                aria-expanded="false"
                aria-controls="photoGallery">
            عرض الصور
        </button>
    </div>

    <div class="gallery-container" id="photoGallery" hidden>
        <img src="assets/img/gallery1.jpg" alt="صورة الفعالية 1">
        <img src="assets/img/gallery2.jpg" alt="صورة الفعالية 2">
        <img src="assets/img/gallery3.jpg" alt="صورة الفعالية 3">
        <img src="assets/img/gallery4.jpg" alt="صورة الفعالية 4">
        <img src="assets/img/gallery5.jpg" alt="صورة الفعالية 5">
        <img src="assets/img/gallery6.jpg" alt="صورة الفعالية 6">
        <img src="assets/img/gallery7.jpg" alt="صورة الفعالية 7">
        <img src="assets/img/gallery8.jpg" alt="صورة الفعالية 8">
        <img src="assets/img/gallery9.jpg" alt="صورة الفعالية 9">
        <img src="assets/img/gallery10.jpg" alt="صورة الفعالية 10">
        <img src="assets/img/gallery11.jpg" alt="صورة الفعالية 11">
        <img src="assets/img/gallery12.jpg" alt="صورة الفعالية 12">
    </div>
</section>

    <section class="event-map">
    <h2>موقع الفعالية</h2>
    <p id="mapLocation">الحرم الجامعي</p>
     
    <div class="map-placeholder">
    <img src="assets/img/map.jpg"
    alt="خريطة الحرم الجامعي"
    class="campus-map">
</div>

</section>
     
    <button type="button" id="shareEventButton" class="event-button">
    مشاركة الرابط
    </button>
    <p id="shareMessage" aria-live="polite"></p>

    <button type="button" id="calendarButton" class="event-button">
    إضافة إلى التقويم
    </button>

    <p id="calendarMessage" aria-live="polite"></p>

    <section class="related-events">
    <h2>فعاليات ذات صلة</h2>
    <div id="relatedEvents" class="related-events-container">
    </div>
</section>

    <a href="events.html" class="event-button">العودة إلى الفعاليات</a>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
