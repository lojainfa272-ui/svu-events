<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>تواصل معنا</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">فعاليات الجامعة</a>

        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>

        </ul>

    <main class="contact-page">

        <h1>تواصل معنا</h1>

        <p>
            يسعدنا استقبال استفساراتكم واقتراحاتكم حول الفعاليات
            والأنشطة الجامعية.
        </p>

        <form id="contactForm" novalidate>

            <label for="name">الاسم الكامل</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="أدخل اسمك الكامل"
                required
            >

            <label for="email">البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >

            <label for="subject">الموضوع</label>
            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="موضوع الرسالة"
                required
            >

            <label for="message">الرسالة</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="أدخل رسالتك هنا"
                required
            ></textarea>

            <button type="submit" class="btn">
                إرسال الرسالة
            </button>

        </form>

        <div
            id="formMessage"
            class="alert d-none mt-3"
            role="alert"
            aria-live="polite"
        ></div>

        <section class="mt-4">
            <h2>معلومات التواصل</h2>

            <p>
                يمكنك التواصل معنا عبر البريد الإلكتروني:
            </p>

            <p>
                <a href="mailto:lujin_346076@svuonline.org">
                    SVU12345@gmail.com
                </a>
            </p>
        </section>

    </main>

    <script src="assets/js/main.js"></script>

</body>
</html>
